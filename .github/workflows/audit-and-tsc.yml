name: Audit and TypeScript Build

on:
  push:
    branches: [ development ]
  pull_request:
    branches: [ development ]

permissions:
  contents: write

jobs:
  audit-and-tsc:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Use Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies (legacy peer deps)
        run: npm install --legacy-peer-deps

      - name: npm audit (fail on high severity)
        run: npm audit --audit-level=high

      - name: TypeScript type-check (no emit)
        run: npx tsc --noEmit

