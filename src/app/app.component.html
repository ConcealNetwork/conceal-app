<mat-sidenav-container class="dark" fullscreen>

  <mat-sidenav #sidenav position="end" role="navigation" mode="push">
    <app-sidenav (sideNavClosed)="sidenav.close()"></app-sidenav> <!-- sidenav -->
  </mat-sidenav>

  <mat-sidenav-content fxLayout="column">

    @if (!getThemingService().isSmallScreen) {
      <app-header></app-header>
      } <!-- header -->
      @if (getThemingService().isSmallScreen) {
        <app-mobile-header></app-mobile-header>
        } <!-- mobile header -->

        <main #main class="container">
          <router-outlet></router-outlet> <!-- content -->
        </main>

        @if (getThemingService().isSmallScreen) {
          <app-mobile-footer (sidenavToggle)="sidenav.toggle()"></app-mobile-footer>
          } <!-- mobile footer -->
          @if (!getThemingService().isSmallScreen) {
            <app-footer></app-footer>
            } <!-- mobile footer -->

          </mat-sidenav-content>

        </mat-sidenav-container>
